<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>안녕하세요 👋</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #667eea, #764ba2);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: white;
      border-radius: 16px;
      padding: 48px 40px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
    }
    .avatar {
      width: 80px; height: 80px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      border-radius: 50%;
      margin: 0 auto 24px;
      display: flex; align-items: center; justify-content: center;
      font-size: 36px;
    }
    h1 { font-size: 28px; color: #1a1a2e; margin-bottom: 12px; }
    p { color: #666; line-height: 1.7; margin-bottom: 16px; font-size: 15px; }
    .badge {
      display: inline-block;
      background: #f0f0ff;
      color: #667eea;
      border-radius: 20px;
      padding: 6px 16px;
      font-size: 13px;
      margin: 4px;
    }
    .footer { margin-top: 32px; font-size: 12px; color: #aaa; }
  </style>
</head>
<body>
  <div class="card">
    <div class="avatar">👨‍💻</div>
    <h1>안녕하세요!</h1>
    <p>저는 <strong>moonjae0409</strong>입니다.<br>웹 개발에 관심이 많고, 새로운 기술을 배우는 것을 좋아합니다.</p>
    <p>이 페이지는 GitHub Pages로 배포된 저의 첫 번째 랜딩 페이지입니다. 🚀</p>
    <div>
      <span class="badge">HTML</span>
      <span class="badge">CSS</span>
      <span class="badge">GitHub Pages</span>
    </div>
    <div class="footer">© 2026 moonjae0409 · GitHub Pages</div>
  </div>
</body>
</html>
